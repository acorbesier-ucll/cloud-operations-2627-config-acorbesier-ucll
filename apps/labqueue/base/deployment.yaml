apiVersion: apps/v1
kind: Deployment
metadata:
  name: labqueue
  namespace: labqueue
  labels:
    app.kubernetes.io/name: labqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: labqueue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below 2 ready pods during a release.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labqueue
    spec:
      automountServiceAccountToken: false
      # The GHCR package is private (the org does not allow public packages).
      # Secret ghcr-pull is created by hand, see infra/README.md.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        # The image uses the named user "node"; kubelet needs a numeric UID to verify runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: labqueue
          # The tag is set per environment in overlays/<env>/kustomization.yaml (images:).
          # "set-by-overlay" is deliberately not a real tag: deploying the base alone fails fast.
          image: ghcr.io/cloud-operations-ucll/cloud-operations-2627-homework-week-2-acorbesier-ucll:set-by-overlay
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: labqueue
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: labqueue-db, key: database }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: labqueue-db, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: labqueue-db, key: password }
          # The app waits up to ~30 s for the database before it listens.
          # The startup probe keeps liveness from killing it during that wait.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 12
          # Liveness: is the process alive? Never depends on the database,
          # otherwise a database outage would restart every app pod for nothing.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: may this pod get traffic? 503 when the database is down or during shutdown.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            # Give the Service and Envoy time to remove this pod before the app gets SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
